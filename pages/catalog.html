<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Pa' la Asada</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/catalog.css">
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/search-bar.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/categorias-catalog.css">
</head>

<body>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <nav class="navbar navbar-expand-lg navbar-custom">

        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand" href="../index.html" aria-label="Ir al inicio">
                <img src="../assets/img/logooscuroancho.png" alt="Logo de Pa' la Asada" class="logo">
            </a>
            <!-- Mobile actions -->

            <div class="d-flex align-items-center ms-auto d-lg-none">
                <!-- Carrito -->
                <button class="btn icon-btn position-relative" type="button" aria-label="Ver carrito">
                    <i class="bi bi-cart3"></i>

                    <span class="cart-badge">
                        0
                    </span>

                </button>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                    aria-label="Abrir menú">

                    <span class="navbar-toggler-icon"></span>

                </button>

            </div>

            <!-- Navegación -->
            <div class="collapse navbar-collapse nav-links" id="navbarNavDropdown">
                <ul class="navbar-nav mx-auto gap-lg-4">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="../pages/catalog.html">
                            Productos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../pages/about-us.html">
                            Acerca de
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../pages/contact.html">
                            Contacto
                        </a>
                    </li>

                </ul>

                <!-- Desktop actions -->

                <div class="nav-actions">
                    <!-- Carrito -->
                    <button class="btn icon-btn position-relative d-none d-lg-block" type="button"
                        aria-label="Ver carrito">

                        <i class="bi bi-cart3"></i>

                        <span class="cart-badge">
                            0
                        </span>

                    </button>

                    <!-- Login / profile is rendered by navbar.js -->

                    <div id="userMenu"></div>

                </div>

            </div>

        </div>

    </nav>


    <!-- =====================================================
         CATALOG CONTENT
         ===================================================== -->

    <main>

        <!-- =====================================================
            SECCIÓN: Búsqueda
        ===================================================== -->
        <section class="search-section">
            <div class="container">
                <div class="search-box">
                    <div class="search-box__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="M20 20L16.5 16.5"></path>
                        </svg>
                    </div>
                    <input type="search" class="search-box__input" placeholder="¿Qué corte estás buscando?"
                        aria-label="Buscar productos">

                    <button type="button" class="search-box__button" aria-label="Buscar">
                        Buscar
                    </button>
                </div>

            </div>

        </section>


        <!-- =====================================================
            SECCIÓN: CATEGORÍAS
        ===================================================== -->
        <section class="category-section">
            <div class="container">

                <div class="category-section__header">
                    <span class="category-section__eyebrow">
                        EXPLORA NUESTRO CATÁLOGO
                    </span>
                    <h2 class="category-section__title">
                        Categorías
                    </h2>
                </div>
                <div class="category-list" role="group" aria-label="Categorías de productos">
                    <!-- CARNES -->
                    <button class="category-button category-button--active" type="button">
                        CARNE
                    </button>
                    <button class="category-button" type="button">
                        RIBEYE
                    </button>
                    <button class="category-button" type="button">
                        NEW YORK
                    </button>
                    <button class="category-button" type="button">
                        PICANA
                    </button>
                    <button class="category-button" type="button">
                        ARRACHERA
                    </button>


                    <!-- CARACTERÍSTICAS -->
                    <button class="category-button" type="button">
                        PREMIUM
                    </button>
                    <button class="category-button" type="button">
                        NUEVO
                    </button>
                    <button class="category-button" type="button">
                        DESCUENTO
                    </button>
                    <button class="category-button" type="button">
                        NACIONAL
                    </button>
                    <button class="category-button" type="button">
                        INTERNACIONAL
                    </button>
                    <button class="category-button" type="button">
                        MÁS VENDIDO
                    </button>
                    <button class="category-button" type="button">
                        HOT SALE
                    </button>
                </div>

            </div>

        </section>



        <!-- =====================================================
                SECCIÓN: PRODUCTOS
             ===================================================== -->
        <section class="catalog-section catalog-section--dark">
            <div class="container">
                <div class="catalog-section__header">
                    <h2 class="catalog-section__title">Cortes Finos</h2>
                    <!--<a href="#" class="catalog-section__link">Ver todo</a>-->
                </div>
                <div class="product-grid">

                    <template>
                        <article class="product-card">
                            <div class="product-card__image">
                                <img src="../assets/img/New york.png" alt="New York Prime premium" loading="lazy">
                                <span class="product-card__badge">
                                    PREMIUM
                                </span>

                            </div>
                            <div class="product-card__content">

                                <span class="product-card__category">
                                    CORTE PREMIUM
                                </span>

                                <h3 class="product-card__title">
                                    New York Angus
                                </h3>

                                <span class="product-card__weight">
                                    550 g aprox.
                                </span>

                                <div class="product-card__footer">

                                    <span class="product-card__price">
                                        $620
                                    </span>
                                    <button class="product-card__add" type="button"
                                        aria-label="Agregar New York Prime al carrito">
                                        +
                                    </button>

                                </div>

                            </div>
                        </article>
                    </template>

                </div>
            </div>
        </section>

        <!-- =====================================================
     MODAL DETALLE PRODUCTO
===================================================== -->

        <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">

                <div class="modal-content">

                    <!-- HEADER -->
                    <div class="modal-header">

                        <h2 class="modal-title fs-4" id="productModalLabel">
                            Detalle del producto
                        </h2>

                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>

                    </div>


                    <!-- BODY -->
                    <div class="modal-body">

                        <div class="row align-items-center g-4">

                            <!-- =========================
                         IMAGEN
                    ========================== -->
                            <div class="col-md-6">

                                <img id="modalProductoImagen" class="img-fluid rounded w-100" src="" alt="">

                            </div>


                            <!-- =========================
                         INFORMACIÓN
                    ========================== -->
                            <div class="col-md-6">

                                <!-- CATEGORÍA -->
                                <p id="modalProductoCategoria" class="text-uppercase fw-bold text-muted mb-2">
                                </p>


                                <!-- NOMBRE -->
                                <h3 id="modalProductoNombre" class="mb-3">
                                </h3>


                                <!-- DESCRIPCIÓN -->
                                <p id="modalProductoDescripcion" class="mb-3">
                                </p>


                                <!-- INFO ADICIONAL -->
                                <div class="mb-3">

                                    <p class="mb-1">
                                        <strong>Peso:</strong>
                                        <span id="modalProductoPeso"></span>
                                    </p>

                                    <p class="mb-1">
                                        <strong>Origen:</strong>
                                        <span id="modalProductoOrigen"></span>
                                    </p>

                                </div>


                                <!-- =========================
                             ESTADO DEL PRODUCTO
                        ========================== -->

                                <div id="modalProductoEstado" class="alert" role="alert">
                                </div>


                                <!-- PRECIO -->
                                <h3 id="modalProductoPrecio" class="mb-4">
                                </h3>


                                <!-- =========================
                             CANTIDAD
                        ========================== -->

                                <div class="mb-4">

                                    <label for="modalCantidad" class="form-label fw-bold">
                                        Cantidad
                                    </label>

                                    <div class="input-group" style="max-width: 180px;">

                                        <button type="button" class="btn btn-outline-secondary" id="btnRestarCantidad">
                                            −
                                        </button>

                                        <input id="modalCantidad" class="form-control text-center" type="number"
                                            value="1" min="1" readonly>

                                        <button type="button" class="btn btn-outline-secondary" id="btnSumarCantidad">
                                            +
                                        </button>

                                    </div>

                                </div>


                                <!-- =========================
                             AGREGAR AL CARRITO
                        ========================== -->

                                <button type="button" id="modalAgregarCarrito" class="btn btn-primary w-100">
                                    Agregar al carrito
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>
        </div>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="footer">

        <div class="footerCont">

            <div class="redesSociales flexCont">

                <div class="seccion-izq">

                    <h2>
                        Pa' la Asada
                    </h2>

                    <h3>
                        Redes sociales
                    </h3>

                    <div class="iconosCont">

                        <a href="https://instagram.com" class="linkRedes" target="_blank" rel="noopener noreferrer">

                            <img src="https://dreamfoundry.org/wp-content/uploads/2018/12/instagram-logo-png-transparent-background.png"
                                alt="Instagram" class="imgRedes">

                        </a>

                        <a href="https://facebook.com" class="linkRedes" target="_blank" rel="noopener noreferrer">

                            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Facebook_Logo_%282019%29.png/1280px-Facebook_Logo_%282019%29.png"
                                alt="Facebook" class="imgRedes">

                        </a>

                    </div>

                </div>


                <div class="footerSection">

                    <img src="../assets/img/LogoCuadrado.jpg" alt="Logo de Pa' la Asada" class="logoFooter">

                </div>


                <nav aria-label="Navegación del pie de página">

                    <a class="enlaceB" href="../index.html">
                        Inicio
                    </a>

                    <a class="enlaceB" href="./about-us.html">
                        Acerca de
                    </a>

                    <a class="enlaceB" href="./catalog.html">
                        Productos
                    </a>

                </nav>

            </div>


            <div class="footerBottom">

                <p>
                    &copy; Todos los derechos reservados.
                </p>

            </div>

        </div>

    </footer>


    <!-- =====================================================
         SCRIPTS
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/navbar.js"></script>

    <script src="../js/catalog.js"></script>


    <script src="../js/productModal.js"></script>

    <!-- DATOS DE PRODUCTOS -->
    <script src="../data/catalogoData.js"></script>

    <!-- CARRITO -->
    <script src="../js/cart.js"></script>
    <script src="../js/categorias-catalog.js"></script>
</body>

</html>
