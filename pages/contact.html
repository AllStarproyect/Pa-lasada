<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Pa' la Asada</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body>
    <!-- =====================================================
         NAVBAR
         ===================================================== -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="../index.html" aria-label="Ir al inicio">
                <img src="../assets/img/Logo3.png" alt="Logo de Pa' la Asada" class="logo">
            </a>

            <!-- Mobile actions -->
            <div class="d-flex align-items-center ms-auto d-lg-none">
                <button class="btn icon-btn position-relative" type="button" aria-label="Ver carrito">
                    <i class="bi bi-cart3"></i>
                    <span class="cart-badge">3</span>
                </button>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                    aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <!-- Collapsible navigation -->
            <div class="collapse navbar-collapse nav-links" id="navbarNavDropdown">
                <ul class="navbar-nav mx-auto gap-lg-4">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./catalog.html">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./about-us.html">Acerca de</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="./contact.html">Contacto</a>
                    </li>
                </ul>

                <!-- Desktop actions -->
                <div class="nav-actions">
                    <button class="btn icon-btn position-relative d-none d-lg-block" type="button"
                        aria-label="Ver carrito">
                        <i class="bi bi-cart3"></i>
                        <span class="cart-badge">3</span>
                    </button>

                    <!-- Login / profile is rendered by navbar.js -->
                    <div id="userMenu"></div>
                </div>
            </div>
        </div>
    </nav>

    <!-- =====================================================
         CONTACT CONTENT
         ===================================================== -->
    <main class="container my-5">
        <div class="contactLayout"> <!-- Clase con la Distribucion principal, diseño responsivo-->

            <!-- Columna Izquierda: Formulario -->
            <div>
                <form id="formContacto" class="d-flex flex-column gap-3 needs-validation" novalidate>
                    <!-- NOMBRE -->
                    <div>
                        <label for="nombre" class="form-label fw-bold">Nombre</label>

                        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" minlength="3"
                            required>

                        <div class="valid-feedback">
                            Nombre válido.
                        </div>

                        <div class="invalid-feedback">
                            Ingresa un nombre de al menos 3 caracteres.
                        </div>
                    </div>

                    <!-- EMAIL -->
                    <div>
                        <label for="email" class="form-label fw-bold">Email</label>

                        <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>

                        <div class="valid-feedback">
                            Correo válido.
                        </div>

                        <div class="invalid-feedback">
                            Ingresa un correo electrónico válido.
                        </div>
                    </div>

                    <!-- COMPAÑÍA -->
                    <div>
                        <label for="compania" class="form-label fw-bold">
                            Compañía / Organización
                        </label>
                        <input type="text" class="form-control" id="compania" placeholder="Nombre de la empresa"
                            minlength="2" required>
                        <div class="valid-feedback">
                            Compañía válida.
                        </div>
                        <div class="invalid-feedback">
                            Ingresa el nombre de la compañía.
                        </div>
                    </div>

                    <!-- MENSAJE -->
                    <div>
                        <label for="mensaje" class="form-label fw-bold">
                            Mensaje
                        </label>

                        <textarea class="form-control" id="mensaje" rows="6" minlength="10"
                            placeholder="Escribe tu mensaje aquí..." required></textarea>

                        <div class="valid-feedback">
                            Mensaje válido.
                        </div>

                        <div class="invalid-feedback">
                            Ingresa un mensaje de al menos 10 caracteres.
                        </div>
                    </div>
                    <!-- ALERTA -->
                    <div id="alertaFormulario"></div>
                    <!-- BOTÓN -->
                    <button type="submit" class="btn btn-dark w-100 mt-2 py-2">
                        Enviar mensaje
                    </button>
                </form>
            </div>

            <!-- Contenedor Tarjetas y mapa diseño ordenador -->
            <div class="contactRight">

                <!-- Contenedor de Tarjetas -->
                <div class="row row-cols-2 row-cols-md-1 row-cols-lg-2 g-3">
                    <div class="col">
                        <div
                            class="card h-100 text-center p-3 shadow-sm border-secondary d-flex align-items-center justify-content-center">
                            <i class="bi bi-envelope-at fs-1"></i>
                        </div>
                    </div>
                    <div class="col">
                        <div
                            class="card h-100 text-center p-3 shadow-sm border-secondary d-flex align-items-center justify-content-center">
                            <i class="bi bi-telephone fs-1"></i>
                        </div>
                    </div>
                    <div class="col">
                        <div
                            class="card h-100 text-center p-3 shadow-sm border-secondary d-flex align-items-center justify-content-center">
                            <i class="bi bi-geo-alt fs-1"></i>
                        </div>
                    </div>
                    <div class="col">
                        <div
                            class="card h-100 text-center p-3 shadow-sm border-secondary d-flex align-items-center justify-content-center">
                            <i class="bi bi-instagram fs-1"></i>
                        </div>
                    </div>
                </div>

                <!-- Contenedor del Mapa -->
                <div class="map-container overflow-hidden rounded-4 shadow-sm">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3762.539598283946!2d-99.1654134!3d19.4270206!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d1ff35f5bd15a7%3A0x10842e4ec558b029!2sEl%20%C3%81ngel%20de%20la%20Independencia!5e0!3m2!1ses!2smx!4v1700000000000!5m2!1ses!2smx"
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </div>
    </main>


    <!-- =====================================================
         SCRIPTS
         ===================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/contact.js"></script>
</body>

</html>
