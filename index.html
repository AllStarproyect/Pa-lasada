<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">

    <title>prueba</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">

            <a class="navbar-brand" href="#">
                <img src="img/Logo.png" alt="Logo" class="logo">
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse nav-links" id="navbarNavDropdown">

                <ul class="navbar-nav mx-auto gap-lg-4">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Productos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Acerca de</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contacto</a>
                    </li>

                </ul>

                <div class="nav-actions">

                    <!-- BOTÓN DEL CARRITO -->
                    <button class="btn icon-btn position-relative" id="openCart">
                        <i class="bi bi-cart3"></i>

                        <span class="cart-badge">
                            !
                        </span>
                    </button>

                    <div id="userMenu"></div>

                </div>

            </div>
        </div>
    </nav>


    <!-- FONDO OSCURO DEL CARRITO -->
    <div class="cart-overlay" id="cartOverlay"></div>


    <!-- BARRA LATERAL DEL CARRITO -->
    <aside class="cart-sidebar" id="cartSidebar">

        <!-- ENCABEZADO -->
        <div class="cart-header">

            <h3>Carrito</h3>

            <button class="cart-close" id="closeCart" aria-label="Cerrar carrito">
                <i class="bi bi-x-lg"></i>
            </button>

        </div>


        <!-- CONTENIDO DEL CARRITO -->
        <div class="cart-body">

            <div class="empty-cart">

                <i class="bi bi-cart-x"></i>

                <p>Carrito vacío</p>

            </div>

        </div>


        <!-- BOTÓN FINALIZAR COMPRA -->
        <div class="cart-footer">

            <button class="checkout-btn">
                Finalizar compra
            </button>

        </div>

    </aside>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
